spring:
  datasource:
    url: jdbc:h2:mem:mealgo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  jwt:
    secret: test-secret-at-least-thirty-two-bytes-long
  seed:
    enabled: true
  dispatch:
    enabled: false
